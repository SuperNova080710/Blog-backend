services:
  postgres:
    image: postgres:16
    container_name: blog-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    ports:
      - "${DB_PORT}:5432"
    
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: